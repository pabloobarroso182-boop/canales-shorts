<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marcas canales nuevos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Montserrat:wght@700;800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.view{position:relative;overflow:hidden;display:none}
.view.on{display:block}
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center;gap:56px}
</style>
</head>
<body>

<!-- ============ 1 · AHORA LO ENTIENDES (explicativos) ============ -->
<!-- Paleta: crema #FFF4E2, turquesa #12B5A5, turquesa oscuro #0B7F75, coral #FF5A4E, amarillo #FFC93C, tinta #1F2A37 -->
<template id="logo1">
  <svg viewBox="0 0 200 200" width="100%" height="100%">
    <!-- bombilla con engranaje dentro: «entender cómo funciona» -->
    <path d="M100 18c-38 0-66 29-66 64 0 24 12 39 24 52 7 8 11 15 11 24v6h62v-6c0-9 4-16 11-24 12-13 24-28 24-52 0-35-28-64-66-64z" fill="#FFC93C" stroke="#1F2A37" stroke-width="8" stroke-linejoin="round"/>
    <rect x="70" y="164" width="60" height="12" rx="5" fill="#1F2A37"/>
    <rect x="78" y="180" width="44" height="10" rx="5" fill="#1F2A37"/>
    <g transform="translate(100 84)">
      <g fill="#12B5A5" stroke="#1F2A37" stroke-width="6" stroke-linejoin="round">
        <path d="M-9 -38h18l3 10 9 4 9-5 13 13-5 9 4 9 10 3v18l-10 3-4 9 5 9-13 13-9-5-9 4-3 10h-18l-3-10-9-4-9 5-13-13 5-9-4-9-10-3v-18l10-3 4-9-5-9 13-13 9 5 9-4z" transform="scale(.82)"/>
      </g>
      <circle r="11" fill="#FFF4E2" stroke="#1F2A37" stroke-width="6"/>
    </g>
    <path d="M150 30l10-10M164 60h14M36 60H22M48 26 40 18" stroke="#FF5A4E" stroke-width="7" stroke-linecap="round"/>
  </svg>
</template>

<div class="view" id="perfil1" style="width:800px;height:800px;background:radial-gradient(circle at 35% 30%,#3FE0CF,#12B5A5 55%,#0B7F75)">
  <div style="position:absolute;inset:80px;border-radius:50%;border:12px solid rgba(255,255,255,.3)"></div>
  <div class="slot" data-logo="logo1" style="position:absolute;left:170px;top:150px;width:460px;height:460px;filter:drop-shadow(0 14px 0 rgba(0,0,0,.18))"></div>
</div>

<div class="view" id="banner1" style="width:2560px;height:1440px;background:#FFF4E2">
  <div style="position:absolute;left:-260px;top:-380px;width:1100px;height:1100px;border-radius:50%;background:#12B5A522"></div>
  <div style="position:absolute;right:-300px;bottom:-420px;width:1200px;height:1200px;border-radius:50%;background:#FF5A4E1A"></div>
  <!-- iconos de «cómo funciona» en los bordes -->
  <div id="iconos1"></div>
  <div class="safe">
    <div class="slot" data-logo="logo1" style="width:330px;height:330px;flex-shrink:0;transform:rotate(-6deg)"></div>
    <div style="font-family:Fredoka;color:#1F2A37">
      <div style="font-size:150px;font-weight:700;line-height:.95;white-space:nowrap">AHORA LO</div>
      <div style="display:inline-block;margin-top:8px;background:#12B5A5;color:#fff;font-size:136px;font-weight:700;line-height:1;padding:6px 40px 16px;border-radius:34px;box-shadow:0 14px 0 #0B7F75;white-space:nowrap">ENTIENDES</div>
      <div style="margin-top:30px;font-family:Montserrat;font-weight:800;font-size:40px;white-space:nowrap">Cómo funciona todo, explicado en 1 minuto <span style="color:#FF5A4E">•</span> Shorts nuevos cada día</div>
    </div>
  </div>
</div>

<!-- ============ 2 · ESCENARIO IMPOSIBLE (¿qué pasaría si…?) ============ -->
<!-- Paleta: noche #120A2E, violeta #5B2EFF, naranja #FF7A1A, amarillo #FFD23F, cian #39E1FF, blanco -->
<template id="logo2">
  <svg viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
      <radialGradient id="g2p" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFB15C"/><stop offset=".6" stop-color="#FF7A1A"/><stop offset="1" stop-color="#C8460A"/></radialGradient>
    </defs>
    <!-- planeta con anillo y «?» : un mundo hipotético -->
    <ellipse cx="100" cy="104" rx="92" ry="30" fill="none" stroke="#39E1FF" stroke-width="9" transform="rotate(-18 100 104)" stroke-dasharray="230 400" stroke-dashoffset="-260"/>
    <circle cx="100" cy="100" r="64" fill="#FF7A1A" stroke="#120A2E" stroke-width="7"/><path d="M58 76a50 50 0 0 1 40-30" stroke="#FFB15C" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M60 140a56 56 0 0 0 76 6" stroke="#C8460A" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="100" y="128" text-anchor="middle" font-family="Anton" font-size="86" fill="#fff" stroke="#120A2E" stroke-width="5" paint-order="stroke">?</text>
    <ellipse cx="100" cy="104" rx="92" ry="30" fill="none" stroke="#39E1FF" stroke-width="9" transform="rotate(-18 100 104)" stroke-dasharray="300 400" stroke-dashoffset="40"/>
    <circle cx="168" cy="40" r="7" fill="#FFD23F"/><circle cx="30" cy="160" r="5" fill="#FFD23F"/><circle cx="40" cy="38" r="4" fill="#fff"/>
  </svg>
</template>

<div class="view" id="perfil2" style="width:800px;height:800px;background:radial-gradient(circle at 50% 40%,#3A1C8F,#1C0F4A 60%,#120A2E)">
  <div class="estrellas"></div>
  <div class="slot" data-logo="logo2" style="position:absolute;left:110px;top:110px;width:580px;height:580px"></div>
</div>

<div class="view" id="banner2" style="width:2560px;height:1440px;background:radial-gradient(1400px 800px at 50% 50%,#2A1470,#120A2E 75%)">
  <div class="estrellas"></div>
  <div style="position:absolute;left:-200px;bottom:-500px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle at 60% 30%,#5B2EFF66,transparent 65%)"></div>
  <div style="position:absolute;right:120px;top:110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9FF2FF,#39E1FF 50%,#1590B5);opacity:.85"></div>
  <div style="position:absolute;left:160px;bottom:120px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,#FFD23F 55%,#C99A00);opacity:.8"></div>
  <div class="safe" style="gap:50px">
    <div class="slot" data-logo="logo2" style="width:380px;height:380px;flex-shrink:0"></div>
    <div style="font-family:Anton;color:#fff;text-align:left">
      <div style="font-family:Montserrat;font-weight:800;font-size:46px;color:#39E1FF;letter-spacing:6px;white-space:nowrap">¿QUÉ PASARÍA SI…?</div>
      <div style="font-size:178px;line-height:.98;letter-spacing:3px;white-space:nowrap">ESCENARIO</div>
      <div style="font-size:178px;line-height:.98;letter-spacing:3px;color:#FF7A1A;white-space:nowrap;text-shadow:0 10px 0 #5B2EFF">IMPOSIBLE</div>
    </div>
  </div>
</div>

<!-- ============ 3 · TU CEREBRO TE ENGAÑA (psicología y dinero del día a día) ============ -->
<!-- Paleta: rosa #FF4F8B, marino #14213D, menta #3DDC97, amarillo #FFD60A, crema #FFF1F5 -->
<template id="logo3">
  <svg viewBox="0 0 200 200" width="100%" height="100%">
    <!-- cerebro guiñando el ojo: «te engaña» -->
    <path d="M100 30c-14-10-36-8-46 6-16 0-28 14-26 30-12 8-16 26-8 40-4 16 6 32 22 36 6 16 24 24 40 18 6 6 12 8 18 8s12-2 18-8c16 6 34-2 40-18 16-4 26-20 22-36 8-14 4-32-8-40 2-16-10-30-26-30-10-14-32-16-46-6z" fill="#FF4F8B" stroke="#14213D" stroke-width="8" stroke-linejoin="round"/>
    <path d="M100 34v134" stroke="#14213D" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 66c10 2 16 10 14 20M146 66c-10 2-16 10-14 20M40 112c12-4 24 0 30 10M162 112c-12-4-24 0-30 10M74 148c4-8 14-12 22-10M128 148c-4-8-14-12-22-10" fill="none" stroke="#B8235A" stroke-width="6" stroke-linecap="round"/>
    <!-- ojos: uno abierto, otro guiñando -->
    <circle cx="74" cy="100" r="15" fill="#fff" stroke="#14213D" stroke-width="5"/><circle cx="78" cy="102" r="7" fill="#14213D"/>
    <path d="M114 102q14-12 28 0" fill="none" stroke="#14213D" stroke-width="7" stroke-linecap="round"/>
    <path d="M80 130q20 16 40 0" fill="none" stroke="#14213D" stroke-width="7" stroke-linecap="round"/>
    <!-- etiqueta de precio colgando: el dinero -->
    <g transform="translate(150 140) rotate(18)">
      <path d="M0 0h40l12 14-12 14H0z" fill="#3DDC97" stroke="#14213D" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="40" cy="14" r="4" fill="#14213D"/>
      <text x="17" y="22" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="20" fill="#14213D">€</text>
    </g>
  </svg>
</template>

<div class="view" id="perfil3" style="width:800px;height:800px;background:radial-gradient(circle at 40% 30%,#26385F,#14213D 65%)">
  <div style="position:absolute;inset:70px;border-radius:50%;border:12px dashed rgba(61,220,151,.45)"></div>
  <div class="slot" data-logo="logo3" style="position:absolute;left:150px;top:150px;width:500px;height:500px"></div>
</div>

<div class="view" id="banner3" style="width:2560px;height:1440px;background:#FFF1F5">
  <div style="position:absolute;inset:0;background-image:radial-gradient(#FF4F8B22 4px,transparent 5px);background-size:70px 70px"></div>
  <div style="position:absolute;left:-300px;top:-300px;width:1000px;height:1000px;border-radius:50%;background:#3DDC9730"></div>
  <div style="position:absolute;right:-260px;bottom:-360px;width:1100px;height:1100px;border-radius:50%;background:#FF4F8B26"></div>
  <!-- ilusión óptica en los bordes: líneas iguales que parecen distintas -->
  <svg style="position:absolute;left:170px;top:150px" width="300" height="220" viewBox="0 0 300 220"><g stroke="#14213D" stroke-width="10" stroke-linecap="round" fill="none"><path d="M40 60h220M40 160h220"/><path d="M40 60l-30-30M40 60l-30 30M260 60l30-30M260 60l30 30M40 160l30-30M40 160l30 30M260 160l-30-30M260 160l-30 30"/></g></svg>
  <svg style="position:absolute;right:190px;bottom:150px" width="260" height="260" viewBox="0 0 260 260"><g fill="none" stroke="#FF4F8B" stroke-width="12"><circle cx="130" cy="130" r="110"/><circle cx="130" cy="130" r="74"/><circle cx="130" cy="130" r="38"/></g></svg>
  <div class="safe" style="gap:44px">
    <div class="slot" data-logo="logo3" style="width:360px;height:360px;flex-shrink:0;transform:rotate(-5deg)"></div>
    <div style="font-family:'Bricolage Grotesque';color:#14213D">
      <div style="font-size:120px;font-weight:800;line-height:.95;white-space:nowrap">TU CEREBRO</div>
      <div style="display:inline-block;margin-top:12px;background:#FF4F8B;color:#fff;font-size:120px;font-weight:800;line-height:1;padding:10px 40px 18px;border-radius:28px;box-shadow:0 14px 0 #14213D;white-space:nowrap;transform:rotate(-2deg)">TE ENGAÑA</div>
      <div style="margin-top:34px;font-family:Montserrat;font-weight:800;font-size:38px;white-space:nowrap">Psicología y dinero del día a día <span style="color:#FF4F8B">•</span> Shorts nuevos cada día</div>
    </div>
  </div>
</div>

<script>
// inserta los logos
document.querySelectorAll('.slot').forEach(s=>{s.appendChild(document.getElementById(s.dataset.logo).content.cloneNode(true));});
// estrellas pseudoaleatorias deterministas
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
document.querySelectorAll('.estrellas').forEach(e=>{const p=e.parentElement;const W=parseInt(p.style.width),H=parseInt(p.style.height);
  for(let i=0;i<(W>1000?260:70);i++){const d=document.createElement('div');const s=1+rnd()*4;
    d.style.cssText=`position:absolute;left:${rnd()*W}px;top:${rnd()*H}px;width:${s}px;height:${s}px;border-radius:50%;background:#fff;opacity:${.25+rnd()*.7}`;e.appendChild(d);}});
// iconos del banner 1 (engranaje, tornillo, rayo, gota, flecha) fuera de la zona segura
const ic=['<circle cx="50" cy="50" r="26"/><circle cx="50" cy="50" r="9"/><path d="M50 8v14M50 78v14M8 50h14M78 50h14M20 20l10 10M70 70l10 10M80 20 70 30M20 80l10-10"/>',
 '<path d="M56 8 26 54h22l-6 38 32-48H52z"/>','<path d="M50 10C34 34 26 48 26 62a24 24 0 0 0 48 0c0-14-8-28-24-52z"/>',
 '<rect x="20" y="30" width="60" height="40" rx="8"/><path d="M80 44h10v12H80"/><path d="M32 42v16M44 42v16M56 42v16"/>','<path d="M14 50h66M60 28l22 22-22 22"/>'];
const c1=document.getElementById('iconos1');const cols=['#12B5A5','#FF5A4E','#FFC93C','#1F2A37'];
for(let i=0;i<26;i++){const x=rnd()*2440,y=rnd()*1320;if(x>380&&x<2180&&y>380&&y<1060)continue;const s=70+rnd()*60;
  c1.insertAdjacentHTML('beforeend',`<svg width="${s}" height="${s}" viewBox="0 0 100 100" style="position:absolute;left:${x}px;top:${y}px;opacity:.55;transform:rotate(${rnd()*40-20}deg)"><g fill="none" stroke="${cols[i%4]}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">${ic[i%5]}</g></svg>`);}
// vista
const v=new URLSearchParams(location.search).get('v');document.getElementById(v).classList.add('on');
</script>
</body>
</html>
